[project]
name = "rotgs"
version = "0.1.0"
requires-python = "==3.10.21"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "numpy>=1.26.4,<2",
    "pillow>=10,<12",
    "tqdm>=4.66,<5",
    "plyfile>=1.0,<2",
    "opencv-python>=4.8,<4.12",
    "joblib>=1.3,<2",
    "open3d==0.19.0",
    "imageio>=2.31,<3",
    "e3nn==0.5.6",
    "yacs>=0.1.8,<0.2",
    "matplotlib>=3.7,<4",
    "scipy>=1.10,<1.16",
    "scikit-learn>=1.3,<1.8",
    "diff-gaussian-rasterization",
    "simple-knn",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
diff-gaussian-rasterization = { path = "submodules/diff-gaussian-rasterization" }
simple-knn = { path = "submodules/simple-knn" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.extra-build-dependencies]
diff-gaussian-rasterization = [
    "torch==2.8.0",
    "ninja>=1.11",
]
simple-knn = [
    "torch==2.8.0",
    "ninja>=1.11",
]
